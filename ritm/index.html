<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ритм</title>
<style>
  :root { color-scheme: light dark; --ground: #FFFFFF; --ink: #1C1C1E; --on-ink: #FFFFFF; --gray: #6C6C70; --field: #F2F2F7; --line: #EFEFF2; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #000000; --ink: #FFFFFF; --on-ink: #1C1C1E; --gray: #98989D; --field: #1C1C1E; --line: #2C2C2E; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink);
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { padding: 32px 20px; width: 100%; max-width: 380px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid var(--line); display: block; }
  h1 { font-size: 34px; line-height: 1.15; letter-spacing: -1px; font-weight: 600; margin: 20px 0 6px; }
  p { color: var(--gray); margin: 0; }
  a.button { display: block; text-align: center; text-decoration: none; font-weight: 600; padding: 17px; border-radius: 28px; margin-top: 10px; }
  a.primary { background: var(--ink); color: var(--on-ink); }
  a.secondary { background: var(--field); color: var(--ink); }
  section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .code { font-size: 28px; font-weight: 600; letter-spacing: 3px; color: var(--ink); margin: 6px 0 4px; }
  footer { margin-top: 28px; font-size: 14px; }
  footer a { color: var(--gray); }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Ритм</h1>
  <p id="lead">Привычки на каждый день.</p>

  <section>
    <a class="button primary" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fsovuhara.github.io%2Fritm%2Fmanifest.plist">Установить</a>
    <p style="margin-top: 14px; font-size: 14px">Откройте эту страницу в Safari на iPhone. После нажатия вернитесь на экран «Домой» — приложение появится там. Сборка 1.</p>
  </section>

</main>
</body>
</html>
